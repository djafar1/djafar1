name: Update private activity metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate aggregate GitHub metrics
        env:
          GH_METRICS_TOKEN: ${{ secrets.GH_METRICS_TOKEN }}
          GH_LOGIN: djafar1
        run: python scripts/generate_private_metrics.py

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/private-activity.svg

          if git diff --cached --quiet; then
            echo "No metric changes to commit."
            exit 0
          fi

          git commit -m "chore: update private activity metrics"
          git push
